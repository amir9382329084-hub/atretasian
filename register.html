<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ثبت‌نام | عطر تاسیان</title><link rel="stylesheet" href="css/style.css"></head><body>
<div class="topline">عضویت در خانواده عطر تاسیان</div><header class="header"><div class="headrow"><div class="actions"><a class="action" href="index.html">⌂ <span>صفحه اصلی</span></a><a class="action" href="login.html">ورود</a></div><a class="brand" href="index.html"><strong>عطر تاسیان</strong><small>TAASIAN PERFUMERY</small></a><a class="action" href="cart.html">♧ <span>سبد خرید</span></a></div></header>
<main class="authWrap"><section class="authCard"><span class="eyebrow">JOIN TAASIAN</span><h1>ساخت حساب کاربری</h1><p>اطلاعات زیر را وارد کنید تا حساب کاربری تاسیان برای شما ساخته شود.</p><form class="authForm" id="registerForm"><label>نام و نام خانوادگی<input name="fullName" autocomplete="name" required maxlength="80" placeholder="نام شما"></label><label>ایمیل<input name="email" type="email" autocomplete="email" required placeholder="name@example.com"></label><label>رمز عبور<input name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="حداقل ۸ کاراکتر"></label><label>تکرار رمز عبور<input name="confirmPassword" type="password" autocomplete="new-password" required minlength="8" placeholder="تکرار رمز عبور"></label><button type="submit">ایجاد حساب</button></form><div class="authMessage" id="authMessage" role="status"></div><div class="authLinks"><a href="login.html">قبلاً ثبت‌نام کرده‌اید؟ وارد شوید</a><a href="index.html">بازگشت به فروشگاه</a></div></section></main>
<div class="toast" id="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/auth.js"></script></body></html>
